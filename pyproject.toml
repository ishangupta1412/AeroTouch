[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerotouch"
version = "1.0.0"
description = "Autonomous Dual-Hand Spatial Operating Layer for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ishan Gupta", email = "ishan14122007@gmail.com" }
]
keywords = [
    "spatial-computing",
    "hand-tracking",
    "computer-vision",
    "mediapipe",
    "win32",
    "touchless-control",
    "kinematics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
]
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "comtypes>=1.2.0",
    "pycaw>=20240210",
    "screen-brightness-control>=0.23.0",
    "mss>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/ishangupta1412/AeroTouch"
Repository = "https://github.com/ishangupta1412/AeroTouch.git"
Issues = "https://github.com/ishangupta1412/AeroTouch/issues"

[project.scripts]
aerotouch = "src.main:run_aerotouch"
